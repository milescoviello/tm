[package]
name = "tm"
version = "0.1.0"
edition = "2021"
description = "A tmux manager: see what every session is running, snapshot it, and bring it back after a reboot"
license = "MIT"
readme = "README.md"

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ansi-to-tui = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
libc = "0.2"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
